id: sensor-barrier-rates
name: The sensor's tunnel rates against a sensor barrier, compile tier and runtime
step: 7
description: On the seed-2 compiled device, the sensor's source and drain tunnel rates against the source barrier gate SB_L, 40 mV either way from the point the leads are compiled at. Each rate recomputed at the compile tier from the WKB action along its barrier of the landscape at the leads' fixed tunnelling level, beside the compiled exponential with its attempt-rate ceiling that the runtime uses. They agree at the anchor, within about 20 per cent over 10 mV, and drift apart further out where the barrier's shape changes; the source rate rises steeply with SB_L, the drain rate only through cross-talk, and both stop at the attempt rate once the barrier is gone (ADR 0026).
layers: [electrostatics, readout, device, compile]
runner: step7c:sensor_barrier_rates
instance:
  layout: two-dot-textbook
  material: SiGe
  pitch_nm: 80.0
  operating_point_v: {B_L: 0.15, P1: 0.6, B_M: 0.2, P2: 0.6, B_R: 0.15, SG: 0.6, R_L: 0.7, R_R: 0.7, SB_L: 0.4, SB_R: 0.3, SR_L: 0.7, SR_R: 0.7}
  temperature_k: 0.15
  severity: 1.0
  seed: 2
sweep:
  - {gate: SB_L, from: -0.04, to: 0.04, points: 41, unit: V, relative_to: leads_anchor}
readout: {channel: tunnel_rate, unit: Hz}
render:
  panels:
    - {kind: line, x: v_barrier_v, y: [gamma_source_compile_hz, gamma_source_runtime_hz, gamma_drain_compile_hz, gamma_drain_runtime_hz, attempt_rate_hz], log_y: true, xlabel: "SB_L (V)", ylabel: "tunnel rate (Hz)", title: "compile tier and runtime exponential"}
budget:
  compile: {wall_s: 2.0, solver_calls: 0}
  run: {wall_ms_per_point: 0.1, points: 41, model_evals_per_point: 1, solver_calls: 0}
must_show: []
