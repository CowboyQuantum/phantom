id: magnetospectroscopy-transition
name: Second-electron transition position against in-plane field for three valley draws
step: 5
description: The gate-voltage position of the one-to-two electron transition against magnetic field for three dots drawn from the Si/SiGe valley distribution. Each trace rises as half the Zeeman energy while the second electron enters the lower valley as a singlet and falls once the Zeeman energy exceeds the valley splitting and the triplet with one electron in the upper valley is lower, so the kink marks each dot's valley splitting (ADR 0020).
layers: [valley]
runner: step5:magnetospectroscopy_transition
instance: {material: SiGe, radius_nm: 10.0, lever_arm_ev_per_v: 0.2, seeds: [1, 2, 3]}
sweep:
  - {axis: B_ext, from: 0.0, to: 3.0, points: 601, unit: T}
readout: {channel: sensor_conductance, unit: transition position in uV}
render:
  panels:
    - {kind: line, x: b_t, y: [shift_draw0_uv, shift_draw1_uv, shift_draw2_uv], xlabel: "in-plane field (T)", ylabel: "transition shift (uV)", title: "kink at B = E_V / (g mu_B)"}
budget:
  compile: {wall_s: 0.5, solver_calls: 0}
  run: {wall_ms_per_point: 0.01, points: 1803, model_evals_per_point: 1, solver_calls: 0}
must_show: []
