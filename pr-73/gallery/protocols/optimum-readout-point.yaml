id: optimum-readout-point
name: Blockade read point and Elzerman read time chosen by the optimum
step: 7
description: For the seed-2 compiled device, the singlet-minus-triplet charge contrast of Pauli spin blockade against detuning, set by the receiving dot's valley draw, the compiled tunnel coupling and the electron temperature, with the read point the optimum chooses marked by a spike of its contrast; and the probability that the dot is empty against time after the Elzerman read pulse for the compiled lead rate and a 1 ms spin relaxation time, with the optimum's read time marked at the peak (ADR 0023).
layers: [valley, spin, device, optimum, compile]
runner: step7b:optimum_readout_point
instance:
  layout: two-dot-textbook
  material: SiGe
  pitch_nm: 80.0
  operating_point_v: {B_L: 0.15, P1: 0.6, B_M: 0.2, P2: 0.6, B_R: 0.15, SG: 0.6, R_L: 0.7, R_R: 0.7, SB_L: 0.4, SB_R: 0.3, SR_L: 0.7, SR_R: 0.7}
  temperature_k: 0.15
  severity: 1.0
  seed: 2
  t1_read_s: 1.0e-3
sweep:
  - {axis: detuning, from: -300.0, to: 500.0, points: 801, unit: ueV}
  - {axis: time, points: 401, unit: "0 to 6 over the lead rate"}
readout: {channel: spin_outcome, unit: contrast and probability}
render:
  panels:
    - {kind: line, x: eps_uev, y: [psb_contrast, psb_chosen_marker], xlabel: "detuning (ueV)", ylabel: "singlet - triplet contrast", title: "blockade read point"}
    - {kind: line, x: t_ns, y: [p_empty, elzerman_chosen_marker], xlabel: "time after pulse (ns)", ylabel: "P(empty)", title: "Elzerman read time"}
budget:
  compile: {wall_s: 2.0, solver_calls: 0}
  run: {wall_ms_per_point: 0.1, points: 1202, model_evals_per_point: 1, solver_calls: 0}
must_show: []
