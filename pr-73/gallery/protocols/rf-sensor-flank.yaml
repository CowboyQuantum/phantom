id: rf-sensor-flank
name: Sensor Coulomb peak read by reflectometry
step: 4
description: The sensor plunger swept across one Coulomb peak with the DC current, the small-bias resistance it implies, and the reflected amplitude and phase at the tank's resonance. The RF flank mirrors the DC peak and is steepest where the sensor resistance crosses the matching value of the tank. Noise-free.
layers: [readout]
runner: step4:rf_sensor_flank
instance:
  tank: {inductance_h: 820.0e-9, parasitic_capacitance_f: 0.5e-12, z0_ohm: 50.0}
sweep:
  - {gate: SG, half_span_v: 0.15, points: 601, unit: V}
readout: {channel: rf_response, unit: reflection coefficient}
render:
  panels:
    - {kind: line, x: v_sg_v, y: current_a, xlabel: "sensor plunger (V)", ylabel: "DC current (A)", title: "DC peak"}
    - {kind: line, x: v_sg_v, y: resistance_ohm, xlabel: "sensor plunger (V)", ylabel: "sensor resistance (ohm)", log_y: true, title: "resistance"}
    - {kind: line, x: v_sg_v, y: [rf_magnitude], xlabel: "sensor plunger (V)", ylabel: "|reflection| at resonance", title: "RF amplitude"}
budget:
  compile: {wall_s: 0.5, solver_calls: 0}
  run: {wall_ms_per_point: 0.02, points: 601, model_evals_per_point: 1, solver_calls: 0}
must_show: []
