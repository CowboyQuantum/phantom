id: session-slow-sensor
name: A slow sensor reads in bursts and its own charge switches
step: 8
description: With dynamics, the sensor dot's charge is a process on the session clock and each sample's current is the charge that left to the drain during the dwell (#54, ADR 0028). The first panel closes both sensor barriers together from the tuned point (`State.sensor_gamma_hz`, log scale). Parked with the sensor's level 1 kT above the leads, a `sampled` session (noise off, 20 µs dwell) reads a smooth current with a little shot noise while the barriers are open (rates about 10¹¹ Hz), and once they are closed (rates 10³–10⁵ Hz) a current that comes in single electrons, while the sensor's own charge switches between two values. The last panels sweep P1 across dot 1's transition at 100 µs per point — read by the open sensor, the step in current is clean; read by the closed one, fewer than one electron arrives per point, and a single sweep shows a few bursts that cannot place the step. With dynamics the sensor's charge also acts back on the dots through the same coupling by which they shift it. Placeholder rates without screening (#48).
layers: [readout, device]
runner: step8:session_slow_sensor
instance:
  layout: two-dot-textbook
  material: SiGe
  pitch_nm: 80.0
  operating_point_v: {B_L: 0.15, P1: 0.6, B_M: 0.2, P2: 0.6, B_R: 0.15, SG: 0.6, R_L: 0.7, R_R: 0.7, SB_L: 0.4, SB_R: 0.3, SR_L: 0.7, SR_R: 0.7}
  temperature_k: 0.15
  severity: 1.0
  seed: 2
  closed_v: {SB_L: -0.085, SB_R: -0.06}
  offset_kt: 1.0
  trace_dwell_s: 2.0e-5
  sweep_dwell_s: 1.0e-4
sweep:
  - {gate: SB_L and SB_R, from: 0.0, to: 1.0, points: 51, unit: fraction of closed_v, relative_to: tuned point}
  - {gate: none, from: 0, to: 399, points: 400, unit: sample, relative_to: parked sensor}
  - {gate: P1, half_span_v: 0.01, points: 201, unit: V, relative_to: dot 1 transition}
readout: {channel: sensor_conductance, unit: A}
render:
  panels:
    - {kind: line, x: closing_fraction, y: [gamma_source_hz, gamma_drain_hz], log_y: true, xlabel: "fraction of the barriers' closing", ylabel: "rate (Hz)", title: "Γ_S, Γ_D as SB_L and SB_R close"}
    - {kind: line, x: sample, y: current_open_a, xlabel: "sample (20 µs)", ylabel: "sensor current (A)", title: "barriers open: shot noise"}
    - {kind: line, x: sample, y: current_closed_a, xlabel: "sample (20 µs)", ylabel: "sensor current (A)", title: "barriers closed: single-electron bursts"}
    - {kind: line, x: sample, y: sensor_charge_closed, xlabel: "sample (20 µs)", ylabel: "sensor charge (e, offset)", title: "barriers closed: the sensor's own charge"}
    - {kind: line, x: dp1_v, y: sweep_current_open_a, xlabel: "P1 from the transition (V)", ylabel: "sensor current (A)", title: "dot 1's transition, open sensor"}
    - {kind: line, x: dp1_v, y: sweep_current_closed_a, xlabel: "P1 from the transition (V)", ylabel: "sensor current (A)", title: "dot 1's transition, closed sensor"}
budget:
  compile: {wall_s: 2.0, solver_calls: 0}
  run: {wall_ms_per_point: 2.0, points: 1253, model_evals_per_point: 1, solver_calls: 0}
must_show: []
