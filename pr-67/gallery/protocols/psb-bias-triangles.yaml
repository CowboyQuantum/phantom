id: psb-bias-triangles
name: Bias triangles at the (1,1)/(0,2) vertex with Pauli spin blockade
step: 6
description: Sequential-tunnelling current against both plungers around the (1,1)/(0,2) vertex at 0.5 mV bias. Forward bias in a 0.1 T field, where an electron loaded next to the one in dot 1 forms a triplet three times in four and cannot relax into the (0,2) singlet, so the base of the triangles up to the valley splitting of dot 2 (one valley draw) is suppressed and current returns beyond it through the valley-excited (0,2) triplet. Forward bias at zero field, where hyperfine and spin-orbit mixing lift the blockade. Reverse bias, where the cycle starts from the (0,2) singlet and nothing is blocked. The rates are placeholders (ADR 0022).
layers: [charge, valley, spin]
runner: step6b:psb_bias_triangles
instance: {v_sd_v: 0.5e-3, b_t: 0.1, valley_seed: 3, radius_nm: 10.0, material: SiGe, rates: {gamma_lead_hz: 1.0e+8, gamma_interdot_hz: 1.0e+7, gamma_mix_hz: 1.0e+7, b_mix_t: 1.0e-3}}
sweep:
  - {gate: P1, half_span_v: 0.012, points: 161, unit: V}
  - {gate: P2, half_span_v: 0.012, points: 161, unit: V}
readout: {channel: current, unit: pA}
render:
  panels:
    - {kind: map, x: v_p1_v, y: v_p2_v, z: current_forward_pa, xlabel: "P1 (V)", ylabel: "P2 (V)", zlabel: "current (pA)", title: "forward, 0.1 T: blocked base"}
    - {kind: map, x: v_p1_v, y: v_p2_v, z: current_forward_zero_field_pa, xlabel: "P1 (V)", ylabel: "P2 (V)", zlabel: "current (pA)", title: "forward, 0 T: lifted by mixing"}
    - {kind: map, x: v_p1_v, y: v_p2_v, z: current_reverse_pa, xlabel: "P1 (V)", ylabel: "P2 (V)", zlabel: "current (pA)", title: "reverse: no blockade"}
budget:
  compile: {wall_s: 0.5, solver_calls: 0}
  run: {wall_ms_per_point: 0.05, points: 25921, model_evals_per_point: 3, solver_calls: 0}
must_show: []
