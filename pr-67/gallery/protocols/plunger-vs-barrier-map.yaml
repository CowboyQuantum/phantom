id: plunger-vs-barrier-map
name: Plunger against the lead barrier of dot 1
step: 1
description: Sensor current against P1 (fast axis) and the barrier B_L between dot 1 and its reservoir (slow axis), on the textbook layout. For every barrier setting the lead rate is the WKB rate of the landscape from the action integral along the barrier (ADR 0017, 0023) and the charge follows the master equation along the row at 1 ms per point, carried across the flyback. The dot-1 transition lines tilt with the barrier's lever arm; as the barrier closes the rate falls below the inverse dwell, the lines fade, latch along the row and carry across rows, while the equilibrium panel keeps clean lines. The fourth panel is the derived lead rate per row. Noise-free. Re-rendered on the master equation in Step 4 (the Step 1 placeholder is retired).
layers: [layout, electrostatics, charge, readout]
runner: step1:plunger_vs_barrier_map
instance:
  layout: two-dot-textbook
  material: SiGe
  pitch_nm: 80.0
  operating_point_v: {B_L: 0.1, P1: 0.6, B_M: 0.2, P2: 0.6, B_R: 0.1, SG: 0.6, R_L: 0.7, R_R: 0.7, SB_L: 0.4, SB_R: 0.3, SR_L: 0.7, SR_R: 0.7}
  temperature_k: 0.15
sweep:
  - {gate: P1, from: -0.06, to: 0.06, points: 200, unit: V, relative_to: operating_point, axis_role: fast}
  - {gate: B_L, from: -0.25, to: 0.2, points: 60, unit: V, axis_role: slow}
readout: {channel: sensor_conductance, unit: A, dt_s: 1.0e-3}
render:
  panels:
    - {kind: map, x: v_p1_v, y: v_bl_v, z: current_a, xlabel: "P1 (V)", ylabel: "lead barrier B_L (V)", zlabel: "sensor current (A)", title: sensor}
    - {kind: map, x: v_p1_v, y: v_bl_v, z: n1_measured, xlabel: "P1 (V)", ylabel: "lead barrier B_L (V)", zlabel: "N1 present (electrons)", title: "dot 1 charge actually present", cmap: magma}
    - {kind: map, x: v_p1_v, y: v_bl_v, z: n1_equilibrium, xlabel: "P1 (V)", ylabel: "lead barrier B_L (V)", zlabel: "N1 at equilibrium (electrons)", title: "dot 1 charge at equilibrium", cmap: magma}
    - {kind: line, x: v_bl_v, y: log10_gamma_left_hz, xlabel: "B_L (V)", ylabel: "log10 lead rate (Hz)", title: "derived lead rate per row"}
budget:
  compile: {wall_s: 5.0, solver_calls: 0}
  run: {wall_ms_per_point: 2.0, points: 12000, model_evals_per_point: 1, solver_calls: 0}
must_show: []
