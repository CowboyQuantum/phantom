provides:
  - label: parabolic-barrier-transmission
    kind: formula
    quantity: transmission_through_a_parabolic_barrier
    conditions: one-dimensional barrier with a parabolic top, energy near the top
    notes: T = 1/(1 + exp(2πΔU/ħω_b)), ΔU the barrier top above the energy (negative below it), ħω_b from the top's curvature. Used in charge.splitting.kemble_transmission for the interdot conductance.
