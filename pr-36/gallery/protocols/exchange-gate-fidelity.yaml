id: exchange-gate-fidelity
name: SWAP exchange-gate fidelity against operating detuning for two noise draws
step: 6
description: Average fidelity of a SWAP gate, J switched on for pi hbar / J at the operating detuning, from the Lindblad propagator with a Markovian T_phi of 100 us and T1 of 1 s, averaged by quadrature over the quasi-static detuning noise of two devices' noise draws, beside the noiseless device. The infidelity has its minimum at the symmetric point, where dJ/dε vanishes and only the Markovian dephasing over the gate time remains, and grows toward the anticrossing with (dJ/dε sigma_eps)²; the two draws differ by their 1/f amplitude. The gate time is recorded alongside (ADR 0022).
layers: [charge, disorder, spin]
runner: step6b:exchange_gate_fidelity
instance: {t0_uev: 20.0, v_scale_v: 0.05, material: SiGe, noise_seeds: [0, 1], spin: {t1_s: 1.0, t_phi_markov_s: 1.0e-4}, quadrature_nodes: 15}
sweep:
  - {axis: eps_over_anticrossing, from: -0.8, to: 0.8, points: 41, unit: ""}
readout: {channel: spin_outcome, unit: average gate fidelity}
render:
  panels:
    - {kind: line, x: eps_mev, y: [infidelity_noiseless, infidelity_draw0, infidelity_draw1], log_y: true, xlabel: "detuning (meV)", ylabel: "1 - F_avg", title: "SWAP infidelity: noiseless and two draws"}
    - {kind: line, x: eps_mev, y: gate_time_ns, log_y: true, xlabel: "detuning (meV)", ylabel: "gate time (ns)"}
budget:
  compile: {wall_s: 0.5, solver_calls: 0}
  run: {wall_ms_per_point: 100.0, points: 41, model_evals_per_point: 1, solver_calls: 0}
must_show: []
