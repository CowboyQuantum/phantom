id: stability-direction
name: Coarse stability map scanned forward and backward at a lagging dwell
step: 4
description: The same layout-derived map as stability-vs-sweep-rate at a dwell near one over the lead rate, with the fast axis (P2) scanned upward in one panel and downward in the other, and the difference of the dot-1 charge between the two. The lagging transitions sit on opposite sides of their equilibrium position, the hysteresis of a latched stability diagram. Noise-free.
layers: [layout, electrostatics, charge, readout]
runner: step4:stability_direction
instance:
  layout: two-dot-textbook
  material: SiGe
  pitch_nm: 80.0
  operating_point_v: {B_L: 0.05, P1: 0.6, B_M: 0.2, P2: 0.6, B_R: 0.05, SG: 0.6, R_L: 0.7, R_R: 0.7}
  temperature_k: 0.15
  dwell_s: 1.0e-5
sweep:
  - {gate: P1, half_span_v: 0.06, points: 80, unit: V, relative_to: operating_point, axis_role: slow}
  - {gate: P2, half_span_v: 0.06, points: 80, unit: V, relative_to: operating_point, axis_role: fast}
readout: {channel: sensor_conductance, unit: A}
render:
  panels:
    - {kind: map, x: v_p1_v, y: v_p2_v, z: current_forward_a, xlabel: "P1 (V)", ylabel: "P2 (V)", zlabel: "sensor current (A)", title: "P2 scanned upward"}
    - {kind: map, x: v_p1_v, y: v_p2_v, z: current_backward_a, xlabel: "P1 (V)", ylabel: "P2 (V)", zlabel: "sensor current (A)", title: "P2 scanned downward"}
    - {kind: map, x: v_p1_v, y: v_p2_v, z: n1_difference, xlabel: "P1 (V)", ylabel: "P2 (V)", zlabel: "N1 up minus N1 down", cmap: RdBu_r, robust: true, title: "difference of the dot-1 charge"}
budget:
  compile: {wall_s: 1.0, solver_calls: 0}
  run: {wall_ms_per_point: 2.0, points: 12800, model_evals_per_point: 1, solver_calls: 0}
must_show: []
