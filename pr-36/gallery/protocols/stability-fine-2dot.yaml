id: stability-fine-2dot
name: Fine charge-stability map around one pair of triple points
step: 1
description: Sensor current against both plungers in a small window centred on the first honeycomb vertex, with the default noise draw. The interdot transition between the two triple points, its length set by the mutual capacitance, and thermal broadening of the lines.
layers: [charge, readout]
runner: step1:stability_fine_2dot
instance: {model: sensed-double-dot, seed: 0, noise: default}
sweep:
  - {gate: P1, half_span_v: 0.012, points: 150, unit: V}
  - {gate: P2, half_span_v: 0.012, points: 150, unit: V}
readout: {channel: sensor_conductance, unit: A, dt_s: 1.0e-3}
render: {kind: map, x: v_p1_v, y: v_p2_v, z: current_a, xlabel: "P1 (V)", ylabel: "P2 (V)", zlabel: "sensor current (A)"}
budget:
  compile: {wall_s: 0.5, solver_calls: 0}
  run: {wall_ms_per_point: 0.1, points: 22500, model_evals_per_point: 1, solver_calls: 0}
must_show: []
