id: pinch-off-barrier
name: Barrier pinch-off
step: 1
description: Current through a channel as one barrier gate closes it. Exponential tail below pinch-off with the barrier's own voltage scale, saturation above. Phenomenological in Step 1 (calibration none).
layers: [readout, charge]
runner: step1:pinch_off_barrier
instance: {model: barrier-pinch-off, barrier: {t0_ev: 2.0e-5, v_ref_v: -0.1, v_scale_v: 0.03}, i_sat_a: 2.0e-9}
sweep:
  - {gate: B, from: -0.4, to: 0.2, points: 601, unit: V}
readout: {channel: current, unit: A}
render:
  panels:
    - {kind: line, x: v_barrier_v, y: current_a, xlabel: "barrier voltage (V)", ylabel: "current (A)", title: linear}
    - {kind: line, x: v_barrier_v, y: current_a, xlabel: "barrier voltage (V)", ylabel: "current (A)", log_y: true, title: log}
budget:
  compile: {wall_s: 0.5, solver_calls: 0}
  run: {wall_ms_per_point: 0.02, points: 601, model_evals_per_point: 1, solver_calls: 0}
must_show: []
