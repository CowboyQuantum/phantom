id: noise-psd
name: Power spectral density of the sensor trace
step: 1
description: Welch estimate (4096-sample Hann segments) of the sensor current noise at the flank point, from the same 30 s trace and seed as noise-time-trace. The 1/f slope from the fluctuator ensemble, Lorentzian shoulders from the dominant trap, and the white floor.
layers: [readout]
runner: step1:noise_psd
instance: {model: sensed-double-dot, seed: 0, noise: default}
sweep:
  - {axis: time, from: 0.0, to: 30.0, points: 30000, unit: s}
readout: {channel: sensor_conductance, unit: A, dt_s: 1.0e-3, duration_s: 30.0, segment: 4096}
render: {kind: line, x: f_hz, y: psd_a2_per_hz, xlabel: "frequency (Hz)", ylabel: "PSD (A^2/Hz)", log_x: true, log_y: true}
budget:
  compile: {wall_s: 0.5, solver_calls: 0}
  run: {wall_ms_per_point: 0.1, points: 30000, model_evals_per_point: 1, solver_calls: 0}
must_show: []
