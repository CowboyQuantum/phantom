id: shikin1991-parabolic-dot-classical-density
title: Dynamic response of quantum dots
authors: [V. Shikin, S. Nazin, D. Heitmann, T. Demel]
year: 1991
venue: Physical Review B 43, 11903
doi: 10.1103/PhysRevB.43.11903
layers: [electrostatics, charge]
provides:
  - label: classical-density-parabolic-dot
    kind: formula
    quantity: electron_density_and_radius_of_a_classical_dot_in_a_parabolic_well
    conditions: two-dimensional electrons in a parabolic confinement, classical (many-electron) regime, no magnetic field
    notes: >
      The equilibrium density is semi-elliptic, n(r) = n₀√(1 − r²/R²), because that density gives a
      parabolic in-plane potential that cancels the well inside the puddle; with the well's curvature k
      the puddle's radius then follows N ∝ R³ (R ∝ N^(1/3)), so the addition energy e²/C falls as
      N^(−1/3). Used in charge.puddle for the dots' size against their occupancy (ADR 0035).
status: proposed
notes: >
  Written by a session on 2026-11-01 for #72 (ADR 0035). The citation (title, authors, volume, page,
  date) was checked against the journal's issue listing; the semi-elliptic density of the classical
  parabolic dot is attributed to this paper by later work (e.g. arXiv:cond-mat/9912079), but the paper
  itself was not opened. The human must confirm the density and the N ∝ R³ relation as printed. A
  related semiclassical treatment of flat dots with any number of electrons is Ovchinnikov, Halder and
  Kresin, EPL 107, 37001 (2014).
