id: golden1996-peak-splitting
title: Relation between barrier conductance and Coulomb blockade peak splitting for tunnel-coupled quantum dots
authors: [J. M. Golden, B. I. Halperin]
year: 1996
venue: Physical Review B 53, 3893
doi: 10.1103/PhysRevB.53.3893
arxiv: cond-mat/9505007
layers: [charge]
provides:
  - label: eq9-weak-coupling
    kind: formula
    quantity: fractional_peak_splitting_weak_coupling
    conditions: two electrostatically equivalent dots, N_ch interdot channels of dimensionless conductance g each (spin channels counted separately), bandwidth much larger than the charging energy, g small
    notes: f = (2 ln 2/π²)·N_ch·g + O(ug, g²); about 0.28·g for one spin-degenerate mode (N_ch = 2). Used in charge.splitting.weak_splitting.
  - label: eq11-strong-coupling
    kind: formula
    quantity: fractional_peak_splitting_strong_coupling
    conditions: as eq9, N_ch = 2, 1 − g small
    notes: f = 1 + (16e^γ/π³)(1 − g)·ln(1 − g), γ Euler's constant; for N_ch = 1 (eq10) 1 − f = (8e^γ/π²)√(1 − g). Used in charge.splitting.strong_splitting.
  - label: definition-f
    kind: formula
    quantity: fractional_peak_splitting_definition
    conditions: as eq9
    notes: f = E_int/(U/4), the lowering of the odd-total-charge ground state by the interdot coupling over its saturated value; f = 1 is the merged dot (peaks at the single-dot period with capacitance 2C_Σ).
status: proposed
notes: >
  Written by a session on 2026-10-31 from the arXiv version (cond-mat/9505007, read through ar5iv) for
  #66 (ADR 0032). The published venue, page and DOI are from memory and unverified: the human must
  confirm them and the three equations. The paper warns that the weak and strong limits do not
  interpolate reliably for N_ch = 2; charge.splitting joins them with a monotone cubic, calibration none.
  Their model has no direct interdot capacitance (f = 0 at g = 0); phantom adds the tunnelling part on top
  of the geometric splitting.
