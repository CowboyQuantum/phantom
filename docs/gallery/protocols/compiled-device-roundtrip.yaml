id: compiled-device-roundtrip
name: Compiled device round trip through serialisation
step: 7
description: A device compiled from the textbook layout with seed 2 (scenario draw, noise draw, valley and spin draws, the derived charge model, the WKB barriers and the sensor set-point), serialised to JSON text and reloaded. The coarse stability map drawn from the original and from the reloaded device, and their difference, which is identically zero. The device file is a few kilobytes because the electrostatics basis is recomputed from the layout and the draw rather than stored (ADR 0023).
layers: [layout, electrostatics, disorder, valley, charge, readout, spin, device, compile]
runner: step7:compiled_device_roundtrip
instance:
  layout: two-dot-textbook
  material: SiGe
  pitch_nm: 80.0
  operating_point_v: {B_L: 0.15, P1: 0.6, B_M: 0.2, P2: 0.6, B_R: 0.15, SG: 0.6, R_L: 0.7, R_R: 0.7}
  temperature_k: 0.15
  severity: 1.0
  seed: 2
sweep:
  - {gate: P1, half_span_v: 0.06, points: 121, unit: V, relative_to: operating_point}
  - {gate: P2, half_span_v: 0.06, points: 121, unit: V, relative_to: operating_point}
readout: {channel: sensor_conductance, unit: A}
render:
  panels:
    - {kind: map, x: v_p1_v, y: v_p2_v, z: current_a, xlabel: "P1 (V)", ylabel: "P2 (V)", zlabel: "sensor current (A)", title: "compiled device"}
    - {kind: map, x: v_p1_v, y: v_p2_v, z: difference_a, xlabel: "P1 (V)", ylabel: "P2 (V)", zlabel: "reloaded - compiled (A)", title: "difference after the round trip"}
budget:
  compile: {wall_s: 2.0, solver_calls: 0}
  run: {wall_ms_per_point: 0.1, points: 29282, model_evals_per_point: 1, solver_calls: 0}
must_show: []
