id: potential-map-disorder
name: Potential landscape of the clean layout and three disorder draws
step: 3
description: The electron energy in the electron plane for the textbook Si/SiGe layout at the operating point, clean and for three seeded disorder draws at severity 1. Each draw adds random interface charges (local dips for positive charges, bumps for negative) and shifts and resizes the gate layer (outlines drawn). Placeholder density from the catalog draft (calibration none).
layers: [layout, electrostatics, disorder]
runner: step3:potential_map_disorder
instance:
  layout: two-dot-textbook
  material: SiGe
  pitch_nm: 80.0
  operating_point_v: {B_L: 0.2, P1: 0.6, B_M: 0.2, P2: 0.6, B_R: 0.2, SG: 0.6, R_L: 0.7, R_R: 0.7}
  seeds: [1, 2, 3]
  severity: 1.0
sweep:
  - {axis: x, unit: nm, points: 381}
  - {axis: y, unit: nm, points: 226}
readout: {channel: potential_energy, unit: meV}
render:
  panels:
    - {kind: map, x: x_nm, y: y_nm, z: u_clean_mev, xlabel: "x (nm)", ylabel: "y (nm)", zlabel: "U (meV)", cmap: viridis_r, overlay: gate_outlines_nm, title: clean}
    - {kind: map, x: x_nm, y: y_nm, z: u_seed1_mev, xlabel: "x (nm)", ylabel: "y (nm)", zlabel: "U (meV)", cmap: viridis_r, overlay: gate_outlines_seed1_nm, title: "draw 1"}
    - {kind: map, x: x_nm, y: y_nm, z: u_seed2_mev, xlabel: "x (nm)", ylabel: "y (nm)", zlabel: "U (meV)", cmap: viridis_r, overlay: gate_outlines_seed2_nm, title: "draw 2"}
    - {kind: map, x: x_nm, y: y_nm, z: u_seed3_mev, xlabel: "x (nm)", ylabel: "y (nm)", zlabel: "U (meV)", cmap: viridis_r, overlay: gate_outlines_seed3_nm, title: "draw 3"}
budget:
  compile: {wall_s: 1.0, solver_calls: 0}
  run: {wall_ms_per_point: 0.001, points: 344424, model_evals_per_point: 1, solver_calls: 0}
must_show: []
