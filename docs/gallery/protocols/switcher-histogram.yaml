id: switcher-histogram
name: Dwell-time statistics of the dominant two-level fluctuator
step: 4
description: A 600 s sensor trace at the flank on a device whose noise is a per-device draw (1/f amplitude, a Poisson number of dominant switchers with amplitudes and rates drawn, white floor; catalog placeholders), and the dwell-time histograms of its largest switcher in each level on logarithmic bins. The dwell times are exponentially distributed with the drawn up and down rates, which are recorded in the arrays with the measured mean dwell times. First 20 s of the trace shown.
layers: [disorder, readout]
runner: step4_noise:switcher_histogram
instance:
  material: SiGe
  seed: 7
  severity: 1.0
sweep:
  - {axis: time, from: 0.0, to: 600.0, points: 600000, unit: s}
readout: {channel: sensor_conductance, unit: A, dt_s: 1.0e-3, duration_s: 600.0}
render:
  zoom_s: 20.0
  panels:
    - {kind: line, x: t_s, y: current_a, xlabel: "time (s)", ylabel: "sensor current (A)", title: "first 20 s"}
    - {kind: line, x: dwell_s, y: [counts_up, counts_down], xlabel: "dwell time (s)", ylabel: "count (+0.5)", log_x: true, log_y: true, title: "dwell times of the dominant switcher"}
budget:
  compile: {wall_s: 1.0, solver_calls: 0}
  run: {wall_ms_per_point: 0.05, points: 600000, model_evals_per_point: 1, solver_calls: 0}
must_show: []
