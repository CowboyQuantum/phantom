id: stability-coarse-2dot
name: Coarse charge-stability map of the double dot
step: 1
description: Sensor current against both plungers over a wide range, raster-scanned at 1 ms per point with the default noise draw. The honeycomb of charge transitions, the lines of both dots with different slopes, the empty corner where transitions stop, and 1/f drift and sensor switching visible as streaks.
layers: [charge, readout]
runner: step1:stability_coarse_2dot
instance: {model: sensed-double-dot, seed: 0, noise: default, sg_v: 0.0}
sweep:
  - {gate: P1, from: -0.05, to: 0.15, points: 200, unit: V}
  - {gate: P2, from: -0.05, to: 0.15, points: 200, unit: V}
readout: {channel: sensor_conductance, unit: A, dt_s: 1.0e-3}
render: {kind: map, x: v_p1_v, y: v_p2_v, z: current_a, xlabel: "P1 (V)", ylabel: "P2 (V)", zlabel: "sensor current (A)"}
budget:
  compile: {wall_s: 0.5, solver_calls: 0}
  run: {wall_ms_per_point: 0.1, points: 40000, model_evals_per_point: 1, solver_calls: 0}
must_show: []
