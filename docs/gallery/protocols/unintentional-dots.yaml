id: unintentional-dots
name: Unintentional dots against interface-charge density
step: 3
description: The mean number of extra minima of the electron energy inside the channel region, beyond the two intended dots, over 25 seeded draws of the textbook layout in the Si MOS material class (charges in the electron plane itself), against the charge-density severity (1 is the catalog draft's MOS placeholder, 3e10 per square centimetre). For Si/SiGe at its placeholder density the charges sit 44 nm above the electron plane and no extra minimum appears below a hundred times the density. Also the 90th percentile and the fraction of draws with at least one extra minimum. The Step 3 P1 row compares this with a published MOS versus SiGe comparison once its reference entry exists.
layers: [layout, electrostatics, disorder]
runner: step3:unintentional_dots
instance:
  layout: two-dot-textbook
  material: MOS
  pitch_nm: 80.0
  operating_point_v: {B_L: 0.2, P1: 0.6, B_M: 0.2, P2: 0.6, B_R: 0.2, SG: 0.6, R_L: 0.7, R_R: 0.7}
  severities: [0.3, 1.0, 3.0, 10.0, 30.0]
  n_draws: 25
sweep:
  - {axis: severity, points: 5, unit: "x placeholder density"}
readout: {channel: minima_count, unit: count}
render:
  panels:
    - {kind: line, x: density_cm2, y: [mean_extra_minima, p90_extra_minima], xlabel: "interface charge density (cm^-2)", ylabel: "extra minima in the channel", log_x: true, title: "mean and 90th percentile over 25 draws"}
    - {kind: line, x: density_cm2, y: fraction_with_extra, xlabel: "interface charge density (cm^-2)", ylabel: "fraction of draws with an extra minimum", log_x: true, title: "fraction"}
budget:
  compile: {wall_s: 1.0, solver_calls: 0}
  run: {wall_ms_per_point: 400.0, points: 125, model_evals_per_point: 1, solver_calls: 0}
must_show: []
