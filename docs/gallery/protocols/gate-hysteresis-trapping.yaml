id: gate-hysteresis-trapping
name: Turn-on swept up and down with charge trapping
step: 3
description: The single-gate turn-on of B_L (rest of the channel open) swept upward and then downward, with traps in the dielectric that charge above 0.6 V and release below 0 V. The trapped charge screens the gate, so the downward trace turns off at a shifted voltage and the two traces enclose a loop, unlike the coinciding traces of gate-hysteresis. The second panel shows the trapped fraction along each direction. Placeholder trap parameters (calibration none).
layers: [layout, electrostatics, disorder, readout]
runner: step3:gate_hysteresis_trapping
instance:
  layout: two-dot-textbook
  material: SiGe
  pitch_nm: 80.0
  grid_pitch_nm: 2.0
  operating_point_v: {B_L: 1.0, P1: 1.0, B_M: 1.0, P2: 1.0, B_R: 1.0, SG: 0.6}
  gate: B_L
  x_range_nm: [-200.0, 200.0]
  threshold_ev: -0.05
  width_ev: 0.004
  i_sat_a: 2.0e-9
  trapping: {capture_v: 0.6, release_v: 0.0, shift_v: 0.15, capture_rate_per_sample: 0.05, release_rate_per_sample: 0.05}
  severity: 1.0
sweep:
  - {gate: B_L, from: -0.6, to: 1.2, points: 361, unit: V, direction: up then down}
readout: {channel: current, unit: A}
render:
  panels:
    - {kind: line, x: v_gate_v, y: [current_up_a, current_down_a], xlabel: "B_L (V)", ylabel: "current (A)", title: "turn-on, up and down"}
    - {kind: line, x: v_gate_v, y: [trapped_up, trapped_down], xlabel: "B_L (V)", ylabel: "trapped fraction", title: "trap occupation"}
budget:
  compile: {wall_s: 0.5, solver_calls: 0}
  run: {wall_ms_per_point: 1.0, points: 722, model_evals_per_point: 1, solver_calls: 0}
must_show: []
