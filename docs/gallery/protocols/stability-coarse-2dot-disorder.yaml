id: stability-coarse-2dot-disorder
name: Coarse charge-stability map, clean and for three disorder draws
step: 3
description: The layout-derived coarse stability map for the clean textbook Si/SiGe layout and for three seeded disorder draws at severity 1, each re-derived from its own perturbed landscape (dot positions, lever arms, capacitances, sensor coupling) with its sensor set on its flank. Lines tilt and shift and the honeycomb period changes between draws; an unintentional minimum would appear as an extra family of lines. Default noise draw, 1 ms per point.
layers: [layout, electrostatics, disorder, charge, readout]
runner: step3:stability_coarse_2dot_disorder
instance:
  layout: two-dot-textbook
  material: SiGe
  pitch_nm: 80.0
  operating_point_v: {B_L: 0.2, P1: 0.6, B_M: 0.2, P2: 0.6, B_R: 0.2, SG: 0.7, R_L: 0.7, R_R: 0.7, SB_L: 0.4, SB_R: 0.35, SR_L: 0.7, SR_R: 0.7}
  temperature_k: 0.15
  sensor_gate: SG
  seeds: [1, 2, 3]
  severity: 1.0
  seed: 0
  noise: default
sweep:
  - {gate: P1, from: -0.12, to: 0.12, points: 120, unit: V, relative_to: operating_point}
  - {gate: P2, from: -0.12, to: 0.12, points: 120, unit: V, relative_to: operating_point}
readout: {channel: sensor_conductance, unit: A, dt_s: 1.0e-3}
render:
  panels:
    - {kind: map, x: v_p1_clean_v, y: v_p2_clean_v, z: current_clean_a, xlabel: "P1 (V)", ylabel: "P2 (V)", zlabel: "sensor current (A)", title: clean}
    - {kind: map, x: v_p1_seed1_v, y: v_p2_seed1_v, z: current_seed1_a, xlabel: "P1 (V)", ylabel: "P2 (V)", zlabel: "sensor current (A)", title: "draw 1"}
    - {kind: map, x: v_p1_seed2_v, y: v_p2_seed2_v, z: current_seed2_a, xlabel: "P1 (V)", ylabel: "P2 (V)", zlabel: "sensor current (A)", title: "draw 2"}
    - {kind: map, x: v_p1_seed3_v, y: v_p2_seed3_v, z: current_seed3_a, xlabel: "P1 (V)", ylabel: "P2 (V)", zlabel: "sensor current (A)", title: "draw 3"}
budget:
  compile: {wall_s: 2.0, solver_calls: 0}
  run: {wall_ms_per_point: 0.1, points: 57600, model_evals_per_point: 1, solver_calls: 0}
must_show: []
