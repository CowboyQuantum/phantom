id: honeycomb-vs-occupancy
name: The dots grow with their occupancy, so the honeycomb opens from the highest cells toward (1,1)
step: 8
description: Each dot is a classical puddle whose radius grows as N^(1/3) with its electrons (the semi-elliptic density of a parabolic dot, Shikin et al. 1991), anchored at the compiled dot (#72, ADR 0035). Its capacitances scale with the gate-induced charge, so the addition energy falls as N^(−1/3) and the geometric triple-point splitting grows with occupancy, and the interdot barrier is seen from the puddles' edges, so at fixed gates it is tens of meV higher at the first electrons than at the compiled occupancy. With the sensor gate tuned onto the optimum's flank and B_M 60 mV above the tuned point, the first panels walk both plungers together from the first electrons to beyond the compiled occupancy and show the puddle radii, the addition energies, the barrier top above the tunnelling level, the splitting f and t. The maps show dot charge (N₁ + ½N₂, every state its own shade) over P1 and P2 at four occupancies, from a grid of large cells near (1,1) through hexagons to the diagonal lines of a superdot at high occupancy. The N^(1/3) scaling is classical and the compiled cut is held where the shape grid moves the dots (calibration none).
layers: [electrostatics, charge, device]
runner: step8:honeycomb_vs_occupancy
instance:
  layout: two-dot-textbook
  material: SiGe
  pitch_nm: 80.0
  operating_point_v: {B_L: 0.15, P1: 0.6, B_M: 0.2, P2: 0.6, B_R: 0.15, SG: 0.6, R_L: 0.7, R_R: 0.7, SB_L: 0.4, SB_R: 0.3, SR_L: 0.7, SR_R: 0.7}
  temperature_k: 0.15
  severity: 1.0
  seed: 2
sweep:
  - {gate: P1 and P2, from: -0.9, to: 0.15, points: 401, unit: V, relative_to: tuned point, b_m_offset_v: 0.06}
  - {gate: P1 and P2, half_span_v: 0.07, points: 81, unit: V, relative_to: tuned point, at: [-0.75, -0.45, -0.15, 0.1], axis_role: maps at plunger offsets}
readout: {channel: dot_charge, unit: e}
render:
  panels:
    - {kind: line, x: dp_v, y: [puddle_radius_1_nm, puddle_radius_2_nm], xlabel: "P1 and P2 from the tuned point (V)", ylabel: "puddle radius (nm)", title: "the puddles grow as N^(1/3)"}
    - {kind: line, x: dp_v, y: [addition_energy_1_ev, addition_energy_2_ev], xlabel: "P1 and P2 from the tuned point (V)", ylabel: "E_add (eV)", title: "the addition energy falls as N^(-1/3)"}
    - {kind: line, x: dp_v, y: [barrier_top_ev], xlabel: "P1 and P2 from the tuned point (V)", ylabel: "ΔU (eV)", title: "the barrier top seen from the puddles' edges"}
    - {kind: line, x: dp_v, y: [splitting], xlabel: "P1 and P2 from the tuned point (V)", ylabel: "f", title: "fractional triple-point splitting"}
    - {kind: line, x: dp_v, y: [tunnel_coupling_ev], log_y: true, xlabel: "P1 and P2 from the tuned point (V)", ylabel: "t (eV)", title: "t along the occupancy"}
    - {kind: map, x: x_v, y: x_v, z: charge_map0, xlabel: "P1 (V)", ylabel: "P2 (V)", zlabel: "N₁ + ½N₂", title: "plungers −0.75 V: the first electrons", cmap: magma}
    - {kind: map, x: x_v, y: x_v, z: charge_map1, xlabel: "P1 (V)", ylabel: "P2 (V)", zlabel: "N₁ + ½N₂", title: "plungers −0.45 V", cmap: magma}
    - {kind: map, x: x_v, y: x_v, z: charge_map2, xlabel: "P1 (V)", ylabel: "P2 (V)", zlabel: "N₁ + ½N₂", title: "plungers −0.15 V", cmap: magma}
    - {kind: map, x: x_v, y: x_v, z: charge_map3, xlabel: "P1 (V)", ylabel: "P2 (V)", zlabel: "N₁ + ½N₂", title: "plungers +0.1 V: a superdot", cmap: magma}
budget:
  compile: {wall_s: 3.0, solver_calls: 0}
  run: {wall_ms_per_point: 0.2, points: 26645, model_evals_per_point: 1, solver_calls: 0}
must_show: []
