id: spin-funnel
name: Spin funnel, singlet probability against detuning and field
step: 6
description: Singlet probability after a singlet is separated into (1,1) and left for a jittered wait, against detuning and in-plane field. Where J(ε) equals the mean Zeeman energy the singlet crosses the T- triplet and a 50 neV mixing term (hyperfine and spin-orbit, placeholder) transfers half the population, tracing out J(ε) as a funnel that widens toward the anticrossing; the Zeeman difference of the g draw also mixes S with T0 wherever it is comparable to J, which costs singlet probability at the lowest J (ADR 0022).
layers: [charge, spin]
runner: step6b:spin_funnel
instance: {t0_uev: 20.0, v_scale_v: 0.05, seed: 0, spin: {g_sigma: 2.0e-3}, delta_mix_nev: 50.0}
sweep:
  - {axis: eps_over_anticrossing, from: -0.9, to: 0.9, points: 301, unit: ""}
  - {axis: B_ext, from: 0.0, to: 0.06, points: 401, unit: T}
readout: {channel: spin_outcome, unit: singlet probability}
render: {kind: map, x: eps_mev, y: b_mt, z: singlet_probability, xlabel: "detuning (meV)", ylabel: "field (mT)", zlabel: "singlet probability", cmap: RdBu}
budget:
  compile: {wall_s: 0.5, solver_calls: 0}
  run: {wall_ms_per_point: 0.01, points: 120701, model_evals_per_point: 1, solver_calls: 0}
must_show: []
