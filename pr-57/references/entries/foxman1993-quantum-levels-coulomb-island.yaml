id: foxman1993-quantum-levels-coulomb-island
title: Effects of quantum levels on transport through a Coulomb island
authors: [E. B. Foxman, P. L. McEuen, U. Meirav, N. S. Wingreen, Y. Meir, P. A. Belk, N. R. Belk, M. A. Kastner, S. J. Wind]
year: 1993
venue: Physical Review B 47, 10020
doi: 10.1103/PhysRevB.47.10020
layers: [readout]
provides:
  - label: lifetime-broadened-peak
    kind: formula
    quantity: coulomb_peak_lineshape_thermal_and_lifetime_broadened
    conditions: single resonant level of a Coulomb island, tunnel widths comparable to kT
    notes: >
      A Coulomb peak whose level has a Lorentzian width hbar(Gamma_S + Gamma_D) convolved with the
      derivative of the Fermi function, and its peak height and width as the tunnel barriers open. The
      closed form through the digamma function used in readout.broadening is the same convolution. A P1
      row would compare the broadened width against the thermal one as the paper reports it.
status: proposed
notes: >
  Written by a session from memory on 2026-10-29 as the candidate standard for the lifetime-broadened
  sensor peak (ADR 0026). The human must confirm the DOI, the author list and that the paper states the
  Lorentzian-convolved lineshape before setting status: confirmed; if another paper is preferred (for
  example a review of resonant tunnelling through a single level), replace this entry.
