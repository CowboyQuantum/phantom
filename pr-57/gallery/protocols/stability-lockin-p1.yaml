id: stability-lockin-p1
name: Chopped-gate stability map, chop on P1
step: 1
description: The coarse stability region read through the sensor_lockin channel with a 1 mV square wave at 1 kHz on P1, four cycles per point, demodulated, with tunnel-rate dynamics. The lead rates rise exponentially with the plungers, so in the low-voltage corner the rate is below the chop frequency and the charge cannot follow, which latches or erases the lines; in the high-voltage corner the rate is far above it and the lines are lifetime-broadened and fainter. Dot-1 lines respond strongly to a P1 chop, dot-2 lines only through cross-capacitance. Default noise draw.
layers: [charge, readout]
runner: step1:stability_lockin
instance:
  model: sensed-double-dot-lead-rates
  seed: 0
  noise: default
  lead_rates: {rate0_hz: [1.0e+3, 1.0e+3], weights_per_v: [[125.0, 20.0, 0.0], [20.0, 125.0, 0.0]]}
sweep:
  - {gate: P1, from: -0.05, to: 0.15, points: 200, unit: V}
  - {gate: P2, from: -0.05, to: 0.15, points: 200, unit: V}
readout: {channel: sensor_lockin, unit: A/V, lockin: {direction: {P1: 1.0}, amplitude_v: 1.0e-3, frequency_hz: 1000.0, cycles: 4}}
render:
  panels:
    - {kind: map, x: v_p1_v, y: v_p2_v, z: lockin_a_per_v, xlabel: "P1 (V)", ylabel: "P2 (V)", zlabel: "dI/dV (A/V)", cmap: RdBu_r, robust: true, title: "demodulated signal"}
    - {kind: map, x: v_p1_v, y: v_p2_v, z: log10_rate_hz, xlabel: "P1 (V)", ylabel: "P2 (V)", zlabel: "log10 lead rate (Hz)", cmap: viridis, title: "lead rate of the faster dot"}
budget:
  compile: {wall_s: 0.5, solver_calls: 0}
  run: {wall_ms_per_point: 0.5, points: 40000, model_evals_per_point: 8, solver_calls: 0}
must_show: []
