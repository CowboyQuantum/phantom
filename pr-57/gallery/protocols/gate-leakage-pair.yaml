id: gate-leakage-pair
name: Leakage between two neighbouring gates
step: 3
description: P1 swept with every other gate grounded when a 1 gigaohm leak connects P1 to B_M. P1 carries a linear leakage current on top of its dielectric leakage, B_M carries the same current with the opposite sign although its own voltage is zero, and the healthy P1 curve is shown for comparison. Placeholder resistance (calibration none).
layers: [layout, disorder, readout]
runner: step3:gate_leakage_pair
instance:
  layout: two-dot-textbook
  material: SiGe
  pitch_nm: 80.0
  leak: [P1, B_M, 1.0e+9]
sweep:
  - {gate: P1, from: -1.0, to: 1.0, points: 201, unit: V}
readout: {channel: leakage_current, unit: A}
render: {kind: line, x: v_gate_v, y: [current_P1_a, current_B_M_a, healthy_P1_a], xlabel: "P1 (V)", ylabel: "current out of the gate (A)"}
budget:
  compile: {wall_s: 0.5, solver_calls: 0}
  run: {wall_ms_per_point: 0.02, points: 201, model_evals_per_point: 1, solver_calls: 0}
must_show: []
