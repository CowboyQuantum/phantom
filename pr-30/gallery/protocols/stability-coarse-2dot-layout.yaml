id: stability-coarse-2dot-layout
name: Coarse charge-stability map derived from a layout
step: 2
description: The same measurement as stability-coarse-2dot, but nothing is typed except the layout, the operating point and the sensor's per-electron coupling. Lever arms, dot capacitances and the sensor's coupling to every gate come from the closed-form potential (ADR 0013). The sensor gate is first set so the sensor sits on the flank of its nearest Coulomb peak, as a tune-up does; the voltage used is recorded in the arrays. Plungers swept plus or minus 0.15 V around the operating point, 1 ms per point, default noise draw. The honeycomb period equals e over the derived gate capacitance; the line slopes are the derived cross lever arms.
layers: [layout, electrostatics, charge, readout]
runner: step2:stability_coarse_2dot_layout
instance:
  layout: two-dot-textbook
  material: SiGe
  pitch_nm: 80.0
  operating_point_v: {B_L: 0.2, P1: 0.6, B_M: 0.2, P2: 0.6, B_R: 0.2, SG: 0.6, R_L: 0.7, R_R: 0.7}
  temperature_k: 0.15
  sensor_gate: SG
  sensor_flank_widths: 0.9
  seed: 0
  noise: default
sweep:
  - {gate: P1, from: -0.15, to: 0.15, points: 150, unit: V, relative_to: operating_point}
  - {gate: P2, from: -0.15, to: 0.15, points: 150, unit: V, relative_to: operating_point}
readout: {channel: sensor_conductance, unit: A, dt_s: 1.0e-3}
render: {kind: map, x: v_p1_v, y: v_p2_v, z: current_a, xlabel: "P1 (V)", ylabel: "P2 (V)", zlabel: "sensor current (A)"}
budget:
  compile: {wall_s: 0.5, solver_calls: 0}
  run: {wall_ms_per_point: 0.1, points: 22500, model_evals_per_point: 1, solver_calls: 0}
must_show: []
