id: ramsey-fringes
name: Ramsey fringes of each dot with the device's quasi-static noise
step: 6
description: Probability of the lower spin state after two pi/2 pulses separated by a wait at a drive detuning of 2 MHz, for both dots at 0.5 T. The fringes oscillate at the detuning. Their Gaussian envelope comes from the quasi-static noise, the hyperfine field (1 neV rms, natural-silicon placeholder) and the g-factor noise through dg/dV driven by the device's charge-noise draw, with T2* = sqrt(2) hbar / sigma_E; the exponential part is the Markovian dephasing. The T2* of each dot is recorded with the arrays (ADR 0021).
layers: [disorder, spin]
runner: step6:ramsey_fringes
instance: {spin: {hyperfine_sigma_ev: 1.0e-9, dg_dv_per_v: 1.0e-3, t_phi_markov_s: 1.0e-4}, seed: 0, material: SiGe, b_t: 0.5, f_detuning_hz: 2.0e+6}
sweep:
  - {axis: tau, from: 0.0, to: 3.0, points: 601, unit: us}
readout: {channel: spin_outcome, unit: probability}
render: {kind: line, x: tau_us, y: [p_down_dot0, p_down_dot1, envelope], xlabel: "wait time (us)", ylabel: "P(down)"}
budget:
  compile: {wall_s: 0.5, solver_calls: 0}
  run: {wall_ms_per_point: 0.01, points: 1202, model_evals_per_point: 1, solver_calls: 0}
must_show: []
