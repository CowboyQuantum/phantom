id: pulsed-gate-spectroscopy
name: Pulsed-gate spectroscopy of the valley-excited state
step: 5
description: Time-averaged occupation of the second electron against plunger voltage and the amplitude of a square pulse on the plunger, for one dot drawn from the Si/SiGe valley distribution. The transition line splits into two lines one pulse amplitude apart; loading through the valley-excited state adds a weaker line displaced from the pulsed line by the valley splitting over the lever arm, so the line spacing reads the splitting. An idealised picture with fixed weights (ADR 0020).
layers: [valley]
runner: step5:pulsed_gate_spectroscopy
instance: {material: SiGe, radius_nm: 10.0, seed: 3, lever_arm_ev_per_v: 0.2, kt_uev: 10.0, excited_weight: 0.4}
sweep:
  - {gate: P1, from: -0.006, to: 0.003, points: 301, unit: V}
  - {axis: pulse_amplitude, from: 0.0, to: 0.004, points: 201, unit: V}
readout: {channel: sensor_conductance, unit: electrons}
render: {kind: map, x: v_plunger_mv, y: pulse_amplitude_mv, z: occupation, xlabel: "P1 (mV)", ylabel: "pulse amplitude (mV)", zlabel: "time-averaged occupation"}
budget:
  compile: {wall_s: 0.5, solver_calls: 0}
  run: {wall_ms_per_point: 0.01, points: 60501, model_evals_per_point: 1, solver_calls: 0}
must_show: []
