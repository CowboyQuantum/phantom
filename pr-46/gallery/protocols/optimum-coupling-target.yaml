id: optimum-coupling-target
name: Interdot coupling against the barrier gate and the optimum's choice for a target
step: 7
description: The interdot tunnel coupling of the seed-2 compiled device against the interdot barrier gate, recomputed at the compile tier from the WKB action along the barrier of the landscape at every barrier voltage, beside the exponential the runtime uses (fitted at the operating point); the compile-tier curve flattens where the barrier top falls below the tunnelling level and the two dots merge. For targets of 10, 30 and 100 microelectronvolts, the barrier voltage the optimum chooses from the exponential beside the voltage where the compile-tier curve crosses the target; their agreement shows how far the exponential holds from the operating point (ADR 0023).
layers: [electrostatics, charge, device, optimum, compile]
runner: step7b:optimum_coupling_target
instance:
  layout: two-dot-textbook
  material: SiGe
  pitch_nm: 80.0
  operating_point_v: {B_L: 0.15, P1: 0.6, B_M: 0.2, P2: 0.6, B_R: 0.15, SG: 0.6, R_L: 0.7, R_R: 0.7}
  temperature_k: 0.15
  severity: 1.0
  seed: 2
  targets_uev: [10.0, 30.0, 100.0]
sweep:
  - {gate: B_M, from: -0.04, to: 0.04, points: 41, unit: V, relative_to: operating_point}
readout: {channel: tunnel_coupling, unit: ueV}
render:
  panels:
    - {kind: line, x: v_barrier_v, y: [t_compile_uev, t_runtime_uev], log_y: true, xlabel: "B_M (V)", ylabel: "t (ueV)", title: "compile tier and runtime exponential"}
    - {kind: line, x: target_uev, y: [v_chosen_by_optimum_v, v_from_compile_tier_v], markers: true, log_x: true, xlabel: "target t (ueV)", ylabel: "B_M (V)", title: "optimum's choice and compile-tier crossing"}
budget:
  compile: {wall_s: 2.0, solver_calls: 0}
  run: {wall_ms_per_point: 0.1, points: 44, model_evals_per_point: 1, solver_calls: 0}
must_show: []
