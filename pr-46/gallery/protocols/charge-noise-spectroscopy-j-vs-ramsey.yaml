id: charge-noise-spectroscopy-j-vs-ramsey
name: Ramsey T2* of the exchange qubit against detuning through dJ/dε
step: 6
description: The dephasing time of the exchange qubit against detuning, from the quadrature-averaged singlet return (the 1/e time of its envelope, sampled per oscillation period) and analytic as sqrt(2) hbar / (sigma_eps dJ/dε), with the detuning noise sigma_eps of the device's draw. T2* is longest at the symmetric point, where dJ/dε vanishes, and falls toward the anticrossing as 1 / (dJ/dε), the direct check that the same charge-noise draw governs the qubit and the sensor (ADR 0022).
layers: [charge, disorder, spin]
runner: step6b:charge_noise_spectroscopy_j_vs_ramsey
instance: {t0_uev: 20.0, v_scale_v: 0.05, seed: 0, material: SiGe, quadrature_nodes: 31}
sweep:
  - {axis: eps_over_anticrossing, from: 0.1, to: 0.9, points: 41, unit: ""}
readout: {channel: spin_outcome, unit: T2* (us)}
render:
  panels:
    - {kind: line, x: eps_mev, y: [t2_star_analytic_us, t2_star_from_decay_us], log_y: true, xlabel: "detuning (meV)", ylabel: "T2* (us)", title: "analytic and from the decay"}
    - {kind: line, x: eps_mev, y: dj_deps, log_y: true, xlabel: "detuning (meV)", ylabel: "dJ/dε"}
budget:
  compile: {wall_s: 0.5, solver_calls: 0}
  run: {wall_ms_per_point: 30.0, points: 41, model_evals_per_point: 1, solver_calls: 0}
must_show: []
