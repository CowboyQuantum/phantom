id: exchange-house-cells
name: Exchange house cells, singlet return against both plungers with J held high
step: 6
description: Singlet return after a fixed evolution time of 2 ns against the two plungers around the evolve point, with the interdot barrier opened to +80 mV so that J is in the GHz range. Inside the (1,1) cell the return probability is cos(J τ/ħ) averaged over the detuning noise of the device's draw, so bands of constant return follow contours of constant J and are cut off by the charge-transition lines of the honeycomb; in (0,2) and (2,0) a singlet returns as a singlet (1.0) and other charge states carry no spin information (0.5). The second panel is J itself inside (1,1) (ADR 0021).
layers: [charge, disorder, spin]
runner: step6:exchange_house_cells
instance: {t0_uev: 20.0, v_scale_v: 0.05, v_barrier_v: 0.08, tau_ns: 2.0, seed: 0, material: SiGe, quadrature_nodes: 7}
sweep:
  - {gate: P1, half_span_v: 0.015, points: 151, unit: V}
  - {gate: P2, half_span_v: 0.015, points: 151, unit: V}
readout: {channel: spin_outcome, unit: singlet probability}
render:
  panels:
    - {kind: map, x: v_p1_v, y: v_p2_v, z: singlet_probability, xlabel: "P1 (V)", ylabel: "P2 (V)", zlabel: "singlet probability", cmap: RdBu}
    - {kind: map, x: v_p1_v, y: v_p2_v, z: j_ghz, xlabel: "P1 (V)", ylabel: "P2 (V)", zlabel: "J/h (GHz) in (1,1)"}
budget:
  compile: {wall_s: 0.5, solver_calls: 0}
  run: {wall_ms_per_point: 0.4, points: 22801, model_evals_per_point: 8, solver_calls: 0}
must_show: []
