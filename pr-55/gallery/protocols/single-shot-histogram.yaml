id: single-shot-histogram
name: Single-shot readout histogram at the sensor flank
step: 4
description: Two thousand consecutive shots of 1 ms at a readout point on the sensor flank, the double dot in one of two charge states differing by one electron on dot 1, chosen at random per shot. The histogram of integrated currents is bimodal; its separation is one electron's shift of the sensor and its widths come from white readout noise over 1 ms plus the 1/f and telegraph noise that move both peaks between shots. The second panel shows the shot sequence in time. Placeholder noise (calibration none).
layers: [charge, readout]
runner: step4:single_shot_histogram
instance:
  seed: 0
  sensor_flank_widths: 0.9
  tau_s: 1.0e-3
  dt_s: 5.0e-5
  n_shots: 2000
sweep:
  - {axis: shot, points: 2000, unit: count}
readout: {channel: sensor_conductance, unit: A integrated over 1 ms}
render:
  panels:
    - {kind: line, x: signal_pa, y: [counts_state0, counts_state1], xlabel: "integrated sensor current (pA)", ylabel: "shots", title: "histogram per true state"}
    - {kind: line, x: shot_index, y: shot_signal_pa, xlabel: "shot", ylabel: "integrated current (pA)", title: "shot sequence"}
budget:
  compile: {wall_s: 0.5, solver_calls: 0}
  run: {wall_ms_per_point: 0.5, points: 2000, model_evals_per_point: 1, solver_calls: 0}
must_show: []
