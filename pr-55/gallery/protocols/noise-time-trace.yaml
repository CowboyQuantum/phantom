id: noise-time-trace
name: Sensor time trace at a fixed point
step: 1
description: Sensor current at a point on the steep flank of a sensor peak, sampled every millisecond for 30 s with the default noise draw. White noise, telegraph switching of the trap near the sensor, and slow 1/f drift of the working point.
layers: [readout]
runner: step1:noise_time_trace
instance: {model: sensed-double-dot, seed: 0, noise: default}
sweep:
  - {axis: time, from: 0.0, to: 30.0, points: 30000, unit: s}
readout: {channel: sensor_conductance, unit: A, dt_s: 1.0e-3, duration_s: 30.0}
render:
  zoom_s: 2.0
  panels:
    - {kind: line, x: t_s, y: current_a, xlabel: "time (s)", ylabel: "sensor current (A)", title: "30 s"}
    - {kind: line, x: t_zoom_s, y: current_zoom_a, xlabel: "time (s)", ylabel: "sensor current (A)", title: "first 2 s"}
budget:
  compile: {wall_s: 0.5, solver_calls: 0}
  run: {wall_ms_per_point: 0.1, points: 30000, model_evals_per_point: 1, solver_calls: 0}
must_show: []
