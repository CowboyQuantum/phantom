id: esr-line
name: Spin resonance lines of the two dots against field and drive frequency
step: 6
description: Spin-flip probability after a pi burst at a Rabi frequency of 5 MHz against the external field and the drive frequency measured from the g = 2 line (2 mu_B B / h, about 28 GHz/T, recorded as g2_line_ghz). Each dot gives one line whose offset grows linearly with field as (g - 2) mu_B B / h, so the two lines fan out by the g-factor difference of the spin draw; their width is the Rabi power broadening (ADR 0021).
layers: [spin]
runner: step6:esr_line
instance: {spin: {g_mean: 2.0, g_sigma: 2.0e-3}, seed: 3, f_rabi_hz: 5.0e+6}
sweep:
  - {axis: B_ext, from: 0.0, to: 1.0, points: 301, unit: T}
  - {axis: f_offset_from_g2, from: -1.0e+8, to: 1.0e+8, points: 401, unit: Hz}
readout: {channel: spin_outcome, unit: flip probability}
render: {kind: map, x: b_t, y: f_offset_mhz, z: flip_probability, xlabel: "field (T)", ylabel: "drive frequency - g=2 line (MHz)", zlabel: "flip probability"}
budget:
  compile: {wall_s: 0.5, solver_calls: 0}
  run: {wall_ms_per_point: 0.002, points: 120701, model_evals_per_point: 2, solver_calls: 0}
must_show: []
