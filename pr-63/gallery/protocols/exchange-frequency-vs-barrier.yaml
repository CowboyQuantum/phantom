id: exchange-frequency-vs-barrier
name: The barrier gate sets the exchange frequency of the dots' valence electrons
step: 8
description: The exchange J of a compiled device is the singlet–triplet splitting of the last electron on each dot, from the singlet secular equation on the CI window's local sector at the gated interdot coupling t and the shaped dots (#60, ADR 0031); it is a qubit pair's exchange where both dots hold an odd number of electrons. With the sensor gate tuned onto the optimum's flank, the first panels sweep B_M around the tuned point and show t and J/h from `Device.at` (log scale; J ∝ t² while t is far below the charge gaps, and jumps where the ground charge state changes). Detuning cuts through the centre of the nearest odd–odd honeycomb cell, at B_M 30 mV lower, at the tuned point and 12 mV higher, show J/h from one anticrossing towards the other beside its second-order form 2t²(1/Δ_R + 1/Δ_L), which it leaves near the anticrossings. Placeholder potential without screening; spinless orbitals, one valley.
layers: [charge, spin, device]
runner: step8:exchange_frequency_vs_barrier
instance:
  layout: two-dot-textbook
  material: SiGe
  pitch_nm: 80.0
  operating_point_v: {B_L: 0.15, P1: 0.6, B_M: 0.2, P2: 0.6, B_R: 0.15, SG: 0.6, R_L: 0.7, R_R: 0.7, SB_L: 0.4, SB_R: 0.3, SR_L: 0.7, SR_R: 0.7}
  temperature_k: 0.15
  severity: 1.0
  seed: 2
sweep:
  - {gate: B_M, from: -0.06, to: 0.04, points: 101, unit: V, relative_to: tuned point}
  - {gate: P1 and P2, half_span_e: 0.95, points: 381, unit: detuning x (n_g moves by (x/2, −x/2)), relative_to: centre of the nearest odd–odd cell, at: [-0.03, 0.0, 0.012]}
readout: {channel: exchange, unit: Hz}
render:
  panels:
    - {kind: line, x: v_b_m_v, y: [tunnel_coupling_ev], log_y: true, xlabel: "B_M (V)", ylabel: "t (eV)", title: "interdot coupling along B_M"}
    - {kind: line, x: v_b_m_v, y: [exchange_hz], log_y: true, xlabel: "B_M (V)", ylabel: "J/h (Hz)", title: "exchange frequency along B_M"}
    - {kind: line, x: x_e, y: [exchange_cut0_hz, second_order_cut0_hz], log_y: true, xlabel: "detuning x (n_g ± x/2)", ylabel: "J/h (Hz)", title: "B_M 30 mV lower"}
    - {kind: line, x: x_e, y: [exchange_cut1_hz, second_order_cut1_hz], log_y: true, xlabel: "detuning x (n_g ± x/2)", ylabel: "J/h (Hz)", title: "tuned point"}
    - {kind: line, x: x_e, y: [exchange_cut2_hz, second_order_cut2_hz], log_y: true, xlabel: "detuning x (n_g ± x/2)", ylabel: "J/h (Hz)", title: "B_M 12 mV higher"}
budget:
  compile: {wall_s: 3.0, solver_calls: 0}
  run: {wall_ms_per_point: 0.5, points: 1244, model_evals_per_point: 1, solver_calls: 0}
must_show: []
