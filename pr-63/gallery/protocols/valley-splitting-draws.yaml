id: valley-splitting-draws
name: Valley-splitting distribution across dots for Si/SiGe and Si MOS
step: 5
description: Histograms of the valley splitting over 4000 dots of 10 nm radius drawn from the Rice distribution of alloy disorder (Si/SiGe, small deterministic part) and from the field-dominated MOS distribution, the fraction of dots below a 50 microelectronvolt threshold, and the Si/SiGe mean against dot radius with the 1/radius law overlaid; the mean departs from that law at large radius, where the deterministic part of the coupling floors it. Reference values are placeholders until the valley reference entries are confirmed (ADR 0020).
layers: [valley]
runner: step5:valley_splitting_draws
instance: {n_dots: 4000, radius_nm: 10.0, threshold_uev: 50.0, radius_min_nm: 6.0, radius_max_nm: 30.0, seed: 0}
sweep:
  - {axis: dot_index, from: 0, to: 3999, points: 4000, unit: ""}
readout: {channel: valley_splitting, unit: ueV}
render:
  panels:
    - {kind: line, x: splitting_uev, y: [count_sige, count_mos], xlabel: "valley splitting (ueV)", ylabel: "dots per bin", title: "4000 dots, 10 nm radius"}
    - {kind: line, x: radius_nm, y: [mean_sige_uev, inverse_radius_law_uev], xlabel: "dot radius (nm)", ylabel: "mean splitting (ueV)", title: "Si/SiGe mean vs radius"}
budget:
  compile: {wall_s: 0.5, solver_calls: 0}
  run: {wall_ms_per_point: 0.01, points: 108000, model_evals_per_point: 1, solver_calls: 0}
must_show: []
