id: davies1995-patterned-2deg
title: "Modeling the patterned two-dimensional electron gas: Electrostatics"
authors: [J. H. Davies, I. A. Larkin, E. V. Sukhorukov]
year: 1995
venue: Journal of Applied Physics 77, 4504
doi: 10.1063/1.359446
layers: [electrostatics, layout]
provides:
  - label: gate-potential-solid-angle
    kind: formula
    quantity: potential_below_a_surface_gate_per_volt
    conditions: half-space of uniform dielectric, surface pinned at zero between gates, no screening by the electrons
    notes: >
      The potential at depth d under a gate held at V is V times the solid angle the gate subtends at the
      point over 2 pi; the paper gives the rectangle (and polygon) result in arctangent form. phantom
      implements the general solid angle (electrostatics.closed_form) and keeps the rectangle form as a test.
      The human confirms the printed form and equation number.
  - label: pinned-surface-boundary-condition
    kind: formula
    quantity: surface_boundary_condition
    conditions: exposed surface between gates at the pinned Fermi level, treated as zero potential
status: proposed
notes: >
  Written by a session from memory on 2026-10-25 as the standard reference for the closed-form
  electrostatics of Step 2 (ADR 0013). The author list is from memory and may be wrong in its third
  author; the DOI must be checked. The human sets status: confirmed only after opening the paper.
