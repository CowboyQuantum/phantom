id: rf-resonance
name: Reflectometry tank resonance for several sensor resistances
step: 4
description: Reflected amplitude and phase against carrier frequency for a lumped tank (820 nH, 0.5 pF, 50 ohm line) loaded by the sensor at four resistances. The resonance near 250 MHz, the dip to zero at the matched resistance of about 33 kiloohm, and the phase flipping by half a turn as the sensor resistance crosses the match. Cables and amplifier are not modelled (ADR 0018).
layers: [readout]
runner: step4:rf_resonance
instance:
  tank: {inductance_h: 820.0e-9, parasitic_capacitance_f: 0.5e-12, z0_ohm: 50.0}
  sensor_resistances_ohm: [1.0e+4, 3.28e+4, 1.0e+5, 1.0e+6]
sweep:
  - {axis: carrier_frequency, from: 200.0e+6, to: 300.0e+6, points: 1001, unit: Hz}
readout: {channel: rf_response, unit: reflection coefficient}
render:
  panels:
    - {kind: line, x: f_mhz, y: [mag_r0, mag_r1, mag_r2, mag_r3], xlabel: "carrier (MHz)", ylabel: "|reflection|", title: "amplitude: 10 k, 32.8 k (matched), 100 k, 1 M ohm"}
    - {kind: line, x: f_mhz, y: [phase_r0_deg, phase_r1_deg, phase_r2_deg, phase_r3_deg], xlabel: "carrier (MHz)", ylabel: "phase (deg)", title: "phase"}
budget:
  compile: {wall_s: 0.5, solver_calls: 0}
  run: {wall_ms_per_point: 0.01, points: 4004, model_evals_per_point: 1, solver_calls: 0}
must_show: []
