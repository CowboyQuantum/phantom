id: beenakker1991-coulomb-blockade
title: Theory of Coulomb-blockade oscillations in the conductance of a quantum dot
authors: [C. W. J. Beenakker]
year: 1991
venue: Physical Review B 44, 1646
doi: 10.1103/PhysRevB.44.1646
layers: [readout]
provides:
  - label: classical-peak-lineshape
    kind: formula
    quantity: coulomb_peak_conductance_thermal_regime
    conditions: single dot, sequential tunnelling, hbar(Gamma_S + Gamma_D) << kT << level spacing or E_c
    notes: >
      In the thermally broadened regime a Coulomb peak in linear response is G = (e^2/4kT) ·
      Gamma_S Gamma_D/(Gamma_S + Gamma_D) · cosh^-2(delta/2kT), delta the level's distance from the
      leads' Fermi level (up to factors of order one from spin degeneracy and the level-spacing regime the
      paper distinguishes). readout.broadening reduces to this form when the lifetime width vanishes
      (tests/test_sensor_leads.py, the thermal limits); a P1 row would reproduce one of the paper's
      lineshape figures once the human picks and digitises it.
status: proposed
notes: >
  Written by a session from memory on 2026-10-29 as the standard for the thermally broadened sensor peak
  (ADR 0026). The human must open the paper, confirm the DOI and the equation, and say which of the
  paper's regimes (classical or quantum, kT against the level spacing) the sensor model should be read in
  before setting status: confirmed.
