id: rabi-chevron
name: Rabi chevron of one spin from the Lindblad propagator
step: 6
description: Spin-flip probability of dot 1 against the drive detuning from resonance and the burst time, propagated with the Lindblad equation in the rotating frame at a Rabi frequency of 10 MHz with the Markovian T1 and T_phi of the parameters. On resonance the spin flips fully every 50 ns; off resonance the oscillation speeds up and loses amplitude, the chevron (ADR 0021).
layers: [spin]
runner: step6:rabi_chevron
instance: {spin: {t1_s: 1.0, t_phi_markov_s: 1.0e-4}, seed: 0, f_rabi_hz: 1.0e+7}
sweep:
  - {axis: f_detuning, from: -5.0e+7, to: 5.0e+7, points: 101, unit: Hz}
  - {axis: tau, from: 0.0, to: 200.0, points: 201, unit: ns}
readout: {channel: spin_outcome, unit: flip probability}
render: {kind: map, x: detuning_mhz, y: tau_ns, z: flip_probability, xlabel: "drive detuning (MHz)", ylabel: "burst time (ns)", zlabel: "flip probability"}
budget:
  compile: {wall_s: 0.5, solver_calls: 0}
  run: {wall_ms_per_point: 0.02, points: 20301, model_evals_per_point: 1, solver_calls: 0}
must_show: []
