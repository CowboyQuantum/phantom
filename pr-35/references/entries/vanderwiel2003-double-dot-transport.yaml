id: vanderwiel2003-double-dot-transport
title: Electron transport through double quantum dots
authors: [W. G. van der Wiel, S. De Franceschi, J. M. Elzerman, T. Fujisawa, S. Tarucha, L. P. Kouwenhoven]
year: 2003
venue: Reviews of Modern Physics 75, 1
doi: 10.1103/RevModPhys.75.1
layers: [charge, readout]
provides:
  - label: ci-honeycomb-geometry
    kind: formula
    quantity: honeycomb_vertex_and_triple_point_geometry_from_capacitances
    conditions: constant-interaction (classical capacitance) model of two dots in series, weak interdot tunnelling
    notes: >
      Section II (the "electrostatics of a double dot"): charge stability diagram, triple points and their
      separation from the mutual capacitance, lever arms from gate capacitances. The P0 rows in
      tests/test_charge_ci.py implement this algebra; a P1 test would reproduce one of the review's
      worked honeycomb figures once the human picks the figure and digitises it.
  - label: coulomb-diamond-slopes
    kind: formula
    quantity: diamond_edge_slopes_from_lever_arm
    conditions: single dot, sequential tunnelling, |eV_sd| up to the addition energy
    notes: Diamond edges at V_sd = ±2 α (V_g − V_0)/e with α the gate lever arm; apex at the addition energy.
status: proposed
notes: >
  Written by a session from memory on 2026-10-25 as the standard reference for the constant-interaction
  picture used in Step 1. The human must open the paper and confirm the DOI, the section numbers and
  the two items before setting status: confirmed. No digitised data yet.
