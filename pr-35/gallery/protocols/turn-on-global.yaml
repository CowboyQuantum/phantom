id: turn-on-global
name: Channel turn-on with all gates raised together
step: 2
description: Current through the channel of the textbook layout as every gate is swept together. The channel opens when the highest point of the electron energy along it, derived from the layout's potential, falls below the threshold; the turn-on voltage therefore follows from the lever arms. The step shape is phenomenological (calibration none). The second panel shows the derived channel barrier energy.
layers: [layout, electrostatics, readout]
runner: step2:turn_on_global_layout
instance:
  layout: two-dot-textbook
  material: SiGe
  pitch_nm: 80.0
  grid_pitch_nm: 2.0
  x_range_nm: [-200.0, 200.0]
  threshold_ev: -0.05
  width_ev: 0.004
  i_sat_a: 2.0e-9
sweep:
  - {gate: all, from: 0.0, to: 1.0, points: 201, unit: V}
readout: {channel: current, unit: A}
render:
  panels:
    - {kind: line, x: v_all_gates_v, y: current_a, xlabel: "all gates (V)", ylabel: "current (A)", title: "channel current"}
    - {kind: line, x: v_all_gates_v, y: u_channel_max_mev, xlabel: "all gates (V)", ylabel: "highest U along the channel (meV)", title: "derived channel barrier"}
budget:
  compile: {wall_s: 0.5, solver_calls: 0}
  run: {wall_ms_per_point: 1.0, points: 201, model_evals_per_point: 1, solver_calls: 0}
must_show: []
